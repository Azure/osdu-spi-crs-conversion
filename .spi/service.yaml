schemaVersion: 3
service:
  name: crs-conversion
  archetype: java-maven-azure
componentGovernance:
  upstream: https://community.opengroup.org/osdu/platform/system/reference/crs-conversion-service
  ignoreDirectories: [crs-converter_acceptance_test, testing]
tests:
  acceptance:
    type: pytest
    path: crs-converter_acceptance_test
    requirements: [requirements.txt, v2/requirements.txt]
    pytestArguments: [test_crs_converter_v2.py, test_crs_converter_v3.py, test_crs_converter_v4.py]
    timeoutMinutes: 20
    bindings:
      VIRTUAL_SERVICE_HOST_NAME: { source: gatewayHost }
      BASE_URL: { source: static, value: /api/crs/converter }
      MY_TENANT: { source: partition }
      MY_REPLACE_DOMAIN: { source: domain }
      MY_LEGAL_TAG: { source: legalTag }
      PRIVILEGED_USER_TOKEN: { source: token }
